site_name: VNote
site_url: https://docs.vnote.fun/
site_description: Documentation for VNote, a privacy-focused Markdown note-taking application.
site_author: VNote Team
repo_name: vnotex/vnote
repo_url: https://github.com/vnotex/vnote
copyright: Copyright &copy; VNoteX Team

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          site_name: VNote
          nav_translations:
            Home: 主页
            Getting Started: 快速开始
            Why VNote: 为什么选择 VNote
            Installation: 安装
            Quick Start: 快速上手
            Dashboard: 仪表盘
            Managing Notes: 管理笔记
            Notebooks, Folders & Notes: 笔记本、文件夹与笔记
            Importing & Migrating: 导入与迁移
            Tags: 标签
            Notebook Sync: 笔记本同步
            Quick Access & History: 快速访问与历史
            Editing: 编辑
            Editor Basics: 编辑器基础
            Markdown Syntax: Markdown 语法
            Math & Diagrams: 数学与图表
            Images & Image Host: 图片与图床
            Snippets: 代码片段
            Templates: 模板
            Mind Maps: 思维导图
            Vi Mode: Vi 模式
            Search: 搜索
            Search Panel: 搜索面板
            United Entry: 统一入口
            Productivity: 效率
            Tasks: 任务
            Export: 导出
            Customization: 自定义
            Settings: 设置
            Themes & Styles: 主题与样式
            Keyboard Shortcuts: 键盘快捷键
            Help: 帮助
            FAQ: 常见问题
            Data Migration: 数据迁移

